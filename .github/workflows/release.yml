name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'EricWF/homebrew-tap' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
      - name: Build cross-platform binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            stage="dist/${os}-${arch}"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "${stage}/mplex" ./cmd/mplex
            tar -C "$stage" -czf "dist/mplex-${os}-${arch}.tar.gz" mplex
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
              gh release delete "$TAG" --yes
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz dist/checksums.txt --clobber
          else
            gh release create "$TAG" dist/*.tar.gz dist/checksums.txt \
              --title "$TAG" \
              --generate-notes
          fi
      - name: Update Homebrew tap (opt-in)
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          TAP_REPO="${HOMEBREW_TAP_REPO:-EricWF/homebrew-tap}"
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          ./scripts/render-homebrew-formula.sh "$TAG" dist/checksums.txt > tap/Formula/mplex.rb
          cd tap
          if git diff --quiet Formula/mplex.rb && [ -z "$(git ls-files --others --exclude-standard Formula/mplex.rb)" ]; then
            echo "Homebrew formula unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mplex.rb
          git commit -m "mplex ${TAG#v}"
          git push origin HEAD
